# Tests en cada PR y push a develop; si pasan y es un push a develop, despliega.
#
# Render se creó con el repositorio público por URL, así que no despliega solo:
# el job `deploy` llama a su Deploy Hook (secreto RENDER_DEPLOY_HOOK_URL) y Render
# construye el último commit de develop. Documentado en el Obsidian:
# ADocuPlus/Despliegue con Dockerfile.md, apartado 7.1.

name: CI (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Dos pushes seguidos: se cancela el anterior y solo se despliega el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Molushop
    steps:
      - uses: actions/checkout@v5

      # diesel con la feature "postgres" enlaza con libpq (igual que en el Dockerfile)
      - name: Instalar libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      # Misma versión que el Dockerfile (rust:1.99)
      - uses: dtolnay/rust-toolchain@1.99

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Molushop

      - name: Tests
        run: cargo test --locked

  # Despliega en Render solo si los tests pasan. Necesita el secreto
  # RENDER_DEPLOY_HOOK_URL (Settings -> Secrets and variables -> Actions).
  deploy:
    needs: test
    # Solo en push a develop (o lanzado a mano), nunca en un PR
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Render (Deploy Hook)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Despliegue pedido a Render"
