# Tests en cada PR y push a develop.
#
# El despliegue en Render (job `deploy`, al final) está comentado: de momento se
# despliega a mano. Render se creó con el repositorio público por URL, así que no
# despliega solo; para automatizarlo haría falta su Deploy Hook (secreto
# RENDER_DEPLOY_HOOK_URL). Documentado en el Obsidian:
# ADocuPlus/Despliegue con Dockerfile.md, apartado 7.1.

name: CI (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Dos pushes seguidos: se cancela el anterior y solo se despliega el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Molushop
    steps:
      - uses: actions/checkout@v5

      # diesel con la feature "postgres" enlaza con libpq (igual que en el Dockerfile)
      - name: Instalar libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      # Misma versión que el Dockerfile (rust:1.99)
      - uses: dtolnay/rust-toolchain@1.99

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Molushop

      - name: Tests
        run: cargo test --locked

