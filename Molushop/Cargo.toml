[package]
name = "Molushop"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files ="*"
tera = "1.19.1"
lazy_static = "1.4.0"
rand = "0.8"
diesel = {version ="2.1.0", features =["postgres","uuid","numeric","chrono","serde_json"]}
diesel-async = {version = "0.5.2", features = ["postgres", "bb8","deadpool"]}
bb8 = "0.9.0"
dotenvy = "0.15"
serde = {version ="1.0", features = ["derive"]}
bigdecimal = "0.4"
chrono = "=0.4.38"
serde_json = "1.0"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.61.0", features = ["behavior-version-latest"] }
tokio = { version = "1", features = ["full"] }
actix-multipart = "0.7.2"
rinja = { version = "0.3.5", feature = "serde_json"} 

[dependencies.uuid]
version = "1.10.0"
features = [
    "v7",
    "v4",                
    "fast-rng",          
    "macro-diagnostics", 
    "serde",
]