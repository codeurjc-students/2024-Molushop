[package]
name = "Molushop"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.7"
lazy_static = "1.4.0"
diesel = {version ="2.3", features =["postgres","uuid","numeric","chrono","serde_json","ipnet-address"]}
diesel-async = {version = "0.9", features = ["postgres", "deadpool"]}
dotenvy = "0.15"
serde = {version ="1.0", features = ["derive"]}
bigdecimal = {version="0.4", features = ["serde"]}
chrono = "0.4.45"
serde_json = "1.0"
serde_urlencoded = "0.7"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.61.0", features = ["behavior-version-latest"] }
tokio = { version = "1", features = ["full"] }
actix-multipart = "0.8.5"
regex = "1.11.1"
argon2 = "0.6"
sha2 = "0.11"
hex = "0.4.3"
thiserror = "2.0.12"
pasetors = "0.8"
futures-util = "0.3.31"
ipnet = "2.11.0"
askama = "0.16.1"
fluent-templates = "0.15.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Sin emit_event_on_error: la línea de cada petición (con su error) la escribe middleware/request_log.rs
tracing-actix-web = { version = "0.7.25", default-features = false }

[dependencies.uuid]
version = "1.10.0"
features = [
    "v7",
    "v4",                
    "fast-rng",          
    "macro-diagnostics", 
    "serde",
]
