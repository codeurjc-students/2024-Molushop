//add variations
<div>
    <label for="cat">Nombre categoría:</label>
    <input type="text" id="cat"  required
    _="on keyup 
        set valueNow to my value.trim()
        set divAux to the next <div/>
        set inputChild to the children of divAux
        for eachChild in inputChild
            set the name of eachChild to 'variations['+valueNow+']'+'['+(eachChild's id) + ']'">
    <div class="var-cont">
        <input id="0" type="text" name="0" required> 
    </div>
    <button hx-get="/add-variations-attributes" 
        hx-target="previous .var-cont"
        hx-swap="beforeend"
        _="on htmx:afterRequest
            increment :x
            set divChildren to the children of the previous <div/>
            set lastChild to the last of divChildren
            set lastChild's id to :x"
            >Add more variations</button>
</div>
