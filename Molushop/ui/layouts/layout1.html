<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_name}}</title>
    <!-- <script src="https://unpkg.com/htmx.org@1.9.2"></script> -->
    <script src="/assets/htmx.js"></script>
    <script src="/assets/response-targets-min.js"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.13"></script>
    <script src="https://cdn.jsdelivr.net/gh/Emtyloc/json-enc-custom@main/json-enc-custom.js"></script>
    <script src="https://unpkg.com/htmx-ext-head-support@2.0.1/head-support.js"></script>
    <link rel="stylesheet" href="/static/styles/base.css">
    <script src="/static/utils/base.js"></script>
    {% block scripts %}{% endblock %}
    {% block styles %}{% endblock %}
</head>
<body hx-ext="head-support,response-targets"
    style="margin:0"
    data-user_logged={{user_logged}}
>
    <header class="full-width-header">
        {% block header %}{% endblock %}
    </header>
    <main class="content-wrapper">
        {% block content %}{% endblock %}
    </main>
    <footer class="full-width-footer">
        {% block footer %}{% endblock %}
    </footer>
</body>
</html>
