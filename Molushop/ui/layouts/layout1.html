<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_name}}</title>
    <!-- Copias locales con versión fija: htmx 2.0.11, response-targets 2.0.4,
         head-support 2.0.5, hyperscript 0.9.14, json-enc-custom 0.1.8. -->
    <script src="/assets/htmx.js"></script>
    <script src="/assets/response-targets.js"></script>
    <script src="/assets/hyperscript.js"></script>
    <script src="/assets/json-enc-custom.js"></script>
    <script src="/assets/head-support.js"></script>
    <link rel="preload" href="/assets/fonts/roboto-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/styles/tokens.css">
    <link rel="stylesheet" href="/static/styles/base.css">
    <link rel="stylesheet" href="/static/styles/atoms/button.css">
    <link rel="stylesheet" href="/static/styles/atoms/field.css">
    <link rel="stylesheet" href="/static/styles/atoms/badge.css">
    <link rel="stylesheet" href="/static/styles/atoms/alert.css">
    <link rel="stylesheet" href="/static/styles/atoms/card.css">
    <link rel="stylesheet" href="/static/styles/atoms/stars.css">
    <link rel="stylesheet" href="/static/styles/atoms/modal.css">
    <link rel="stylesheet" href="/static/styles/atoms/price.css">
    <link rel="stylesheet" href="/static/styles/atoms/quantity.css">
    <script src="/static/utils/base.js"></script>
    {% block scripts %}{% endblock %}
    {% block styles %}{% endblock %}
</head>
<body hx-ext="head-support,response-targets"
    style="margin:0"
    data-user_logged={{user_logged}}
>
    <header class="full-width-header">
        {% block header %}{% endblock %}
    </header>
    <main class="content-wrapper">
        {% block content %}{% endblock %}
    </main>
    <footer class="full-width-footer">
        {% block footer %}{% endblock %}
    </footer>
</body>
</html>
