{# Átomo de cantidad: el struct está en src/models/components/quantity.rs y el
   JS de los botones es QUANTITY (ui/utils/base.js). El componente que lo usa
   lee la cantidad de .m-qty__input y escucha el evento m-qty-change (y, con
   removable, m-qty-remove: el − en el mínimo es una papelera). #}
<span class="m-qty{% if small %} m-qty--sm{% endif %}"><button type="button" class="m-qty__btn{% if minus_removes() %} is-remove{% endif %}" data-step="-1"{% if minus_disabled() %} disabled{% endif %} aria-label="{% if minus_removes() %}{{label("qty-remove")}}{% else %}{{label("qty-decrease")}}{% endif %}"{% if removable %} data-label-decrease="{{label("qty-decrease")}}" data-label-remove="{{label("qty-remove")}}"{% endif %}>{% if removable %}<span class="m-qty__minus" aria-hidden="true">−</span><svg class="m-qty__trash" aria-hidden="true"><use href="/assets/svg/icons/full.svg#icon-trash" /></svg>{% else %}−{% endif %}</button><input type="number" class="m-qty__input" inputmode="numeric" value="{{value}}" min="{{min}}"{% if let Some(m) = max %} max="{{m}}"{% endif %} aria-label="{{label("qty-label")}}"><button type="button" class="m-qty__btn" data-step="1"{% if at_max() %} disabled{% endif %} aria-label="{{label("qty-increase")}}">+</button></span>
