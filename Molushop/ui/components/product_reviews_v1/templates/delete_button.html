<!-- En un include porque sale en dos sitios: dentro del formulario y en el
     aviso de "solo compradores". hx-confirm usa el confirm() del navegador:
     el borrado es duro y se lleva el texto. -->
<button type="button" class="m-btn m-btn--danger-outline delete-review"
    hx-delete="{{reviews.delete_url()}}"
    hx-confirm="{{ i18n.t("reviews-delete-confirm") }}"
    hx-target="#product-reviews-1"
    hx-swap="outerHTML"
    hx-ext="response-targets"
    hx-target-500="#review-form-error">
    {{ i18n.t("reviews-delete") }}
</button>
