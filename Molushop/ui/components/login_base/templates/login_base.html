{% let routes = login_base_data.routes %}

<div class="login-base">
    <div class="cont-total">

        <div class="container-ext login" hx-ext="response-targets">
            <form
                hx-post="{{routes.login}}"
                hx-target="body"
                hx-target-4*="body"
                hx-target-5*="body"
                hx-swap="beforeend"
                hx-ext="json-enc-custom"
                hx-on::after-request="login_base.do_after_login(event)"
            >
                <!-- <div class="imgcontainer">
                    <img src="img_avatar2.png" alt="Avatar" class="avatar">
                </div> -->
                <div class="container-title">
                    <span>Login</span>
                </div>
                
                <div class="container">
                    <div class="m-field">
                        <label class="m-label" for="login-username">Username</label>
                        <input class="m-input" id="login-username" type="text" placeholder="Enter Username" name="username" required autocomplete="username">
                    </div>
                    <div class="m-field">
                        <label class="m-label" for="login-pass">Password</label>
                        <input class="m-input" id="login-pass" type="password" placeholder="Enter Password" name="pass" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="m-btn m-btn--primary m-btn--block">Login</button>
                    <a class="forgot-link" href="/password/forgot">¿Has olvidado tu contraseña?</a>
                    <label class="m-check">
                        <input type="checkbox" checked="checked" name="remember"> Remember me
                    </label>
                </div>
            </form> 
            <div class="container">
                <hr>
                <button type="button" class="m-btn m-btn--ghost m-btn--block change"
                    _="on click 
                    set containerOne to the closest .container-ext
                    set containerTwo to the next <div/> from containerOne
                    toggle .disabled on containerOne
                    toggle .disabled on containerTwo
                    end"
                >Si no tienes cuenta, registrate!</button>
            </div>


            <div class="container container-footer">
                <button type="button" class="m-btn m-btn--secondary cancelbtn">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </div>
        <div class="container-ext register disabled" hx-ext="response-targets">
            <form
                hx-post="{{routes.create_user}}"
                hx-target="body"
                hx-target-4*="body"
                hx-target-5*="body"
                hx-swap="beforeend"
                hx-ext="json-enc-custom"
            >
                <!-- <div class="imgcontainer">
                    <img src="img_avatar2.png" alt="Avatar" class="avatar">
                </div> -->
                <div class="container-title">
                    <span>Register</span>
                </div>
                
                <div class="container">
                    <div class="m-field">
                        <label class="m-label" for="register-username">Username</label>
                        <input class="m-input" id="register-username" type="text" placeholder="Enter Username" name="username" required>
                    </div>
                    <div class="m-field">
                        <label class="m-label" for="register-email">Email</label>
                        <input class="m-input" id="register-email" type="text" placeholder="Enter Email" name="email" required>
                    </div>
                    <div class="m-field">
                        <label class="m-label" for="register-pass">Password</label>
                        <input class="m-input" id="register-pass" type="password" placeholder="Enter Password" name="pass" required>
                    </div>
                    <div class="m-field">
                        <label class="m-label" for="register-pass2">Repeat Password</label>
                        <input class="m-input" id="register-pass2" type="password" placeholder="Enter Password" name="pass2" required>
                    </div>

                    <button type="submit" class="m-btn m-btn--primary m-btn--block">Register</button>
                    <label class="m-check">
                        <input type="checkbox" checked="checked"> Remember me
                    </label>
                </div>
            </form> 
            
            <div class="container">
                <hr>
                <button type="button" class="m-btn m-btn--ghost m-btn--block change"
                    _="on click 
                    set containerOne to the closest .container-ext
                    set containerTwo to the previous .container-ext from containerOne
                    toggle .disabled on containerOne
                    toggle .disabled on containerTwo
                    end"
                >Ya estoy registrado!</button>
            </div>

            <div class="container container-footer">
                <button type="button" class="m-btn m-btn--secondary cancelbtn">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </div>
    </div>
</div>
