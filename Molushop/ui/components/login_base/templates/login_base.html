{% let routes = login_base_data.routes %}

<div class="login-base">
    <div class="cont-total">

        <div class="container-ext login" hx-ext="response-targets">
            <form
                hx-post="{{routes.login}}"
                hx-target="body"
                hx-target-4*="body"
                hx-target-5*="body"
                hx-swap="beforeend"
                hx-ext="json-enc-custom"
                hx-on::after-request="login_base.do_after_login(event)"
            >
                <!-- <div class="imgcontainer">
                    <img src="img_avatar2.png" alt="Avatar" class="avatar">
                </div> -->
                <div class="container-title">
                    <span>Login</span>
                </div>
                
                <div class="container">
                    <label for="uname"><b>Username</b></label>
                    <input type="text" placeholder="Enter Username" name="username" required autocomplete="username">
                    
                    <label for="psw"><b>Password</b></label>
                    <input type="password" placeholder="Enter Password" name="pass" required autocomplete="current-password">
                    
                    <button type="submit">Login</button>
                    <label>
                        <input type="checkbox" checked="checked" name="remember"> Remember me
                    </label>
                </div>
            </form> 
            <div class="container">
                <hr>
                <button class="change"
                    _="on click 
                    set containerOne to the closest .container-ext
                    set containerTwo to the next <div/> from containerOne
                    toggle .disabled on containerOne
                    toggle .disabled on containerTwo
                    end"
                >Si no tienes cuenta, registrate!</buttonñ>
            </div>


            <div class="container" style="background-color:#f1f1f1">
                <button type="button" class="cancelbtn">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </div>
        <div class="container-ext register disabled" hx-ext="response-targets">
            <form
                hx-post="{{routes.create_user}}"
                hx-target="body"
                hx-target-4*="body"
                hx-target-5*="body"
                hx-swap="beforeend"
                hx-ext="json-enc-custom"
            >
                <!-- <div class="imgcontainer">
                    <img src="img_avatar2.png" alt="Avatar" class="avatar">
                </div> -->
                <div class="container-title">
                    <span>Register</span>
                </div>
                
                <div class="container">
                    <label for="name"><b>Username</b></label>
                    <input type="text" placeholder="Enter Username" name="username" required>
                    
                    <label for="mail"><b>Email</b></label>
                    <input type="text" placeholder="Enter Email" name="email" required>
                    
                    <label for="pass"><b>Password</b></label>
                    <input type="password" placeholder="Enter Password" name="pass" required>
                    
                    <label for="pass2"><b>Repeat Password</b></label>
                    <input type="password" placeholder="Enter Password" name="pass2" required>
                    
                    <button type="submit">Register</button>
                    <label>
                        <input type="checkbox" checked="checked"> Remember me
                    </label>
                </div>
            </form> 
            
            <div class="container">
                <hr>
                <button class="change"
                    _="on click 
                    set containerOne to the closest .container-ext
                    set containerTwo to the previous .container-ext from containerOne
                    toggle .disabled on containerOne
                    toggle .disabled on containerTwo
                    end"
                >Ya estoy registrado!</buttonñ>
            </div>

            <div class="container" style="background-color:#f1f1f1">
                <button type="button" class="cancelbtn">Cancel</button>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </div>
    </div>
</div>
