

<div class="product-card">
    <!-- <a href="#" class="link"> -->
    <a class="link" href="{{product.url}}">
        <!--La ruta de la imagen dependerá del producto-->
        <img src="{{product.image}}" alt="{{product.name}}">
        <div class="producto-info">
            <h3 class="producto-titulo">
                <span>{{product.name}}</span>
            </h3>
            <!-- Vacío si no hay opiniones, pero ocupa su alto para que las
                 tarjetas de una fila sigan alineadas. -->
            <div class="producto-valoracion">
                {% if product.rating_count > 0 %}
                {{ product.stars() }}
                <span class="producto-valoracion-total">({{product.rating_count}})</span>
                {% endif %}
            </div>
            <p class="producto-precio">{{product.price}}€</p>
            <div class="producto-acciones">
                <button type="button" class="m-btn m-btn--primary m-btn--block boton-agregar-carrito">Añadir al carrito</button>
            </div>
        </div>
    </a>
</div>
