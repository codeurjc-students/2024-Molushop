{# El valor no lleva `name` hasta que la spec tiene nombre: sin él, el
   navegador no lo manda y no llega una spec sin nombre. #}
<div>
    <input class="m-input" type="text" placeholder="Nombre (p. ej. Peso)" aria-label="Nombre de la spec"
        _="on keyup
            set valueNow to my value.trim()
            set nextInput to the next <input/>
            if valueNow is empty
                remove @name from nextInput
            else
                set nextInput's name to 'specs['+valueNow+']'
            end">
    <input class="m-input" type="text" placeholder="Valor" aria-label="Valor de la spec">
</div>
