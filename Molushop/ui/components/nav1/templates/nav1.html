
<div class="nav1">
  <div class="container-nav">
    <div class="logo">
      <a class="active" href="{{nav1.routes.home}}">
        <img src="/assets/logos/molushop-on-green.svg" alt="Molushop" />
      </a>
    </div>

    {# Un GET normal a /search (con hx-boost, sin recargar): funciona igual sin JS. #}
    <div class="search-bar">
      <form action="{{nav1.routes.search}}" method="get" role="search">
        <div class="search-box-container">
          <input type="search" name="q" value="{{nav1.search}}" placeholder="Busca productos o marcas" aria-label="Buscar productos" maxlength="100" enterkeyhint="search">
          <button type="submit" class="search-icon" aria-label="Buscar">
            <svg class="icn-svg" aria-hidden="true"><use href="/assets/svg/icons/full.svg#icon-search" /></svg>
          </button>
        </div>
      </form>
    </div>
    <div class="right-block">
      <div class="cart">
        <a class="cart-icon" href="{{nav1.routes.cart}}" aria-label="Carrito">
          <svg class="icn-svg" aria-hidden="true"><use href="/assets/svg/icons/full.svg#icon-cart" /></svg>
          {% if nav1.cart_count > 0 %}
          <span id="cart-badge" class="cart-badge">{{nav1.cart_count}}</span>
          {% else %}
          <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
          {% endif %}
        </a>
      </div>
      <div class="profile">
        <button type="button" class="user-icon" aria-label="Perfil" aria-haspopup="true" aria-expanded="false" aria-controls="profile-menu">
          <p>{{nav1.name}}</p>
          <svg class="icn-svg" aria-hidden="true"><use href="/assets/svg/icons/full.svg#icon-user" /></svg>
        </button>
        <div id="profile-menu" class="profile-menu" hidden>
          {% if nav1.logged %}
          <ul class="profile-menu-list">
            <li><a href="{{nav1.routes.orders}}">Mis Pedidos</a></li>
            <li><a href="{{nav1.routes.account}}">Mi cuenta</a></li>
          </ul>
          <button type="button" class="profile-menu-logout"
            hx-post="{{nav1.routes.logout}}"
            hx-target="body"
            hx-target-5*="body"
            hx-swap="beforeend"
          >Cerrar sesión</button>
          {% else %}
          <button type="button" class="profile-menu-login open-login-modal">Identifícate</button>
          <button type="button" class="profile-menu-register open-register-modal">Registrarse</button>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
